<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议室预约系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="brand">
        <span class="brand-logo">📅</span>
        <div>
            <h1>会议室预约系统</h1>
            <p class="brand-sub">会议室在线预订 · 冲突自动检测</p>
        </div>
    </div>
    <div class="header-date">
        <label for="datePicker">预约日期</label>
        <input type="date" id="datePicker" />
    </div>
</header>

<nav class="room-tabs" id="roomTabs"></nav>

<main class="board">
    <div class="legend">
        <span class="legend-item"><i class="dot free"></i>可预约</span>
        <span class="legend-item"><i class="dot booked"></i>已预约</span>
    </div>
    <div class="timeline-wrap">
        <div class="time-axis" id="timeAxis"></div>
        <div class="schedule" id="schedule">
            <div class="empty-hint">加载中...</div>
        </div>
    </div>
</main>

<!-- 预约弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">新建预约</h3>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        <form id="bookingForm">
            <input type="hidden" id="fBookingId">
            <div class="form-row">
                <label>会议室</label>
                <span id="fRoom" class="form-static"></span>
            </div>
            <div class="form-row">
                <label>日期</label>
                <input type="date" id="fDate" required>
            </div>
            <div class="form-row two-col">
                <div>
                    <label>开始时间</label>
                    <input type="time" id="fStart" required>
                </div>
                <div>
                    <label>结束时间</label>
                    <input type="time" id="fEnd" required>
                </div>
            </div>
            <div class="form-row">
                <label>会议主题 <em>*</em></label>
                <input type="text" id="fTitle" placeholder="如：周例会" maxlength="50" required>
            </div>
            <div class="form-row">
                <label>预约人 <em>*</em></label>
                <input type="text" id="fOrganizer" placeholder="姓名" maxlength="20" required>
            </div>
            <div class="form-row">
                <label>联系电话</label>
                <input type="text" id="fPhone" placeholder="选填" maxlength="20">
            </div>
            <div class="form-row">
                <label>备注</label>
                <textarea id="fNote" rows="2" maxlength="200" placeholder="选填"></textarea>
            </div>
            <div class="error-msg" id="formError" hidden></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="deleteBtn" hidden>取消预约</button>
                <span class="spacer"></span>
                <button type="button" class="btn btn-ghost" id="cancelBtn">关闭</button>
                <button type="submit" class="btn btn-primary">提交预约</button>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
